# mantou docker-compose 部署示例
#
# 两种网络模式二选一：
#
#  A. 桥接模式（默认，见下方 services.mantou）
#     - 只映射面板端口，安全隔离
#     - 端口转发/Web 服务用到的端口需要手动追加到 ports 列表
#
#  B. host 模式（推荐给「端口转发 / Web 服务 / WOL 广播」重度用户，仅 Linux 宿主机）
#     - 取消 network_mode 注释、删除 ports 段
#     - 容器直接使用宿主机网络，任意监听端口无需逐一映射
#     - WOL 魔术包广播、组播发现等依赖二层网络的功能才能正常工作
#     ⚠️ 注意：host 网络模式仅在 Linux 宿主机生效。Docker Desktop（Windows / macOS）
#        不支持 host 模式，启用后容器将无法启动。在桌面 Docker 上请改用「模式 A」手动映射端口。
#
#  💡 桌面 Docker（Windows/macOS）想免映射测试 Web 服务？最省事的做法是「本地直接运行」：
#     mantou 是单一静态二进制，直接在宿主机执行（无需容器）即可绑定任意端口，天然免去端口映射：
#        make build && ./bin/mantou --data ./data      # 或下载的 mantou 可执行文件
#     然后用浏览器访问 http://localhost:<Web 服务端口> 即可。Docker 仅建议用于生产（按需映射端口）。
#
# 启动：  docker compose up -d
# 查看：  docker compose logs -f
# 升级：  docker compose pull && docker compose up -d   （使用远程镜像时）

services:
  mantou:
    build:
      context: .
      args:
        # 网络受限时设置加速站前缀（结尾带 /），例如：
        #   MIRROR=docker.1ms.run/library/ docker compose up -d --build
        # 也可写进项目根目录的 .env 文件长期生效。默认留空，直接走 docker.io。
        MIRROR: ${MIRROR:-}
        # Go 模块代理（受限网络走国内镜像），例如：
        #   GOPROXY=https://goproxy.cn,direct docker compose up -d --build
        GOPROXY: ${GOPROXY:-}
        # npm 镜像源（受限网络走国内镜像），例如：
        #   NPM_REGISTRY=https://registry.npmmirror.com docker compose up -d --build
        NPM_REGISTRY: ${NPM_REGISTRY:-}
      # 不在此处覆盖 VERSION —— Dockerfile 默认值 Ver 0.0.0 即最终版本号；
      # 如需自定义，构建时用 `docker compose build --build-arg VERSION=Ver 9.9.9` 即可。
    image: mantou:latest
    container_name: mantou
    restart: unless-stopped

    # ---- 模式 A：桥接（默认） ----
    # 桥接模式下，只有这里显式映射的端口才能从宿主机访问到；Web 服务/端口转发绑定的其它端口
    # 需要各自加一行映射（左侧=宿主机端口，右侧=容器内端口），保存后 `docker compose up -d` 重建。
    # ⚠️ 这正是「每开一个 Web 服务端口就要改一次 compose」的由来——这是 Docker 桥接的固有限制，
    #    不是 mantou 的配置问题。想彻底免映射请看下方「模式 B」或「本地直接运行」两种方案。
    ports:
      - "25666:25666"          # 控制面板（固定，必须映射）
      # 下面按需追加你实际配置的 Web 服务 / 端口转发端口，例如：
      # - "18080:18080"        # 某条 Web 服务 HTTP
      # - "443:443"            # 某条 Web 服务 HTTPS
      # - "2222:2222"          # 某条端口转发规则

    # ---- 模式 B：host 网络（按需启用，启用后请注释掉上面的 ports） ----
    # network_mode: host

    environment:
      - MANTOU_DATA_DIR=/data
      - TZ=Asia/Shanghai
      # Go 运行时软内存上限。设置它之后，堆逼近 200 MiB 时 GC 会显著加频并主动把内存
      # 还给操作系统，而不是任由堆按 GOGC=100 的比例一路涨上去。
      # 之所以需要：mantou 的内存峰值来自**并发连接的转发缓冲**——端口转发每条 TCP 连接约 64 KiB
      #（收发各 32 KiB，上限 1024 条/规则），反向代理每个在传响应约 32 KiB（上限 2000 连接/监听端口），
      # 打满即可达数十 MB，而平时稳态只有几十 MB。没有软上限的话，一次流量高峰把堆撑大后，
      # Go 不会主动缩回去，容器的 RSS 就长期停在峰值附近，看起来像内存泄漏。
      # 它是**软**上限：超过后 Go 只会更拼命地 GC，不会 OOM kill，因此可以放心设。
      # 与下方 deploy.resources.limits.memory=256M 配套：软上限先起作用，硬上限只是兜底。
      - GOMEMLIMIT=200MiB

    # ---- 数据持久化：全部在容器内（无外部挂载） ----
    # 设计意图：所有配置 / 日志 / 上传背景图 / 证书 直接写入容器可写层（由 MANTOU_DATA_DIR=/data 指定）。
    # 不挂命名卷、也不挂绑定挂载 —— 因此「删除容器即删除全部数据」：
    #   - `docker rm mantou` 或 `docker compose down`（移除容器）后，数据随可写层一并消失；
    #   - `docker restart` / `restart: unless-stopped` 自动重启、宿主机重启都不丢（可写层保留）。
    # 跨设备 / 长期保留请依赖面板内的「配置备份」导出（AES 加密），不要指望容器留存。
    # 如需改为外部持久化（数据独立于容器），再启用下方任一行即可：
    #   - mantou-data:/data      # 命名卷（Docker 管理，删容器不丢，仅 down -v 才丢）
    #   - ./data:/data           # 绑定挂载（落到宿主机目录，便于查看/同步）
    # volumes:
    #   - mantou-data:/data

    # ---- 关于健康状态标签：不提供 ----
    # 容器只有 running / stop 两个默认状态，不会出现 healthy / unhealthy。
    # 镜像里没写 HEALTHCHECK，程序里也没有可供探活的地址——这个面板不向未登录的请求
    # 回答任何东西，包括"我还活着"（原因见 Dockerfile 末尾）。
    # 所以这里也不留注释掉的示例：照着填只会探到一个不存在的路径，反而把好着的容器
    # 标成 unhealthy。判断进程是否在跑，用 `docker ps` 的状态列。

    # ---- 内存硬上限：兜住「软上限也没拦住」的极端情况 ----
    # 256M 的来源：稳态 30~60 MB + 高并发转发缓冲峰值（数十 MB）+ 上方 GOMEMLIMIT 的 200 MiB 软上限，
    # 留出约 25% 余量给 Go 运行时自身的非堆开销（栈、mspan、GC 元数据）。
    # 触发硬上限时容器会被 OOM kill 并按 restart: unless-stopped 自动重启——这是**兜底**，
    # 正常运行不应该碰到；真碰到了说明有内存泄漏，请带上 `docker stats` 的输出提 issue。
    #
    # 关于 deploy.resources：docker compose（v2，即 `docker compose` 而非老的 `docker-compose`）
    # 在**非 Swarm** 模式下同样会读取这里的 limits，无需 `--compatibility`。
    # 若你的环境仍在用 v1 版 docker-compose，请改用顶层的 `mem_limit: 256m`。
    deploy:
      resources:
        limits:
          memory: 256M

# 数据备份（当前为纯容器内，无命名卷）：用 docker cp 进出容器
#   导出：docker cp mantou:/data ./mantou-data-backup
#   导入（先 docker compose up 建好容器）：docker cp ./mantou-data-backup/. mantou:/data
# 命名卷方案（如需启用）的备份命令：
#   docker run --rm -v mantou-data:/data -v "$PWD":/backup alpine tar czf /backup/mantou-data.tgz -C /data .
